name: Release DevPilot CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.mod
      - name: Test CLI
        working-directory: cli
        run: go test ./...
      - name: Build release binaries
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/devpilot-windows-amd64.exe .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/devpilot-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/devpilot-darwin-arm64 .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/devpilot-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist/devpilot-linux-arm64 .
          (cd ../dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/devpilot-windows-amd64.exe
            dist/devpilot-darwin-amd64
            dist/devpilot-darwin-arm64
            dist/devpilot-linux-amd64
            dist/devpilot-linux-arm64
            dist/SHA256SUMS.txt
